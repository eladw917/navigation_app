services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: navigation
      POSTGRES_PASSWORD: navigation
      POSTGRES_DB: navigation
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigation -d navigation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
